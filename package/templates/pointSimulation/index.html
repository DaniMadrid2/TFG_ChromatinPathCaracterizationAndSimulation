<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trayectorias Shader DSL</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101e22; color: #f2f6f4; font: 16px system-ui; }
    main { max-width: 1420px; margin: 0 auto; padding: 32px 24px 48px; }
    h1 { margin: 0 0 30px; font-size: 28px; font-weight: 650; }
    .views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    section { min-width: 0; }
    h2 { margin: 0 0 12px; font-size: 17px; font-weight: 600; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; background: #24424a; }
    @media (max-width: 800px) { .views { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Trayectorias 2D</h1>
    <div class="views">
      <section>
        <h2>C1</h2>
        <canvas id="trajectory-c1" width="640" height="480"></canvas>
      </section>
      <section>
        <h2>C2</h2>
        <canvas id="trajectory-c2" width="640" height="480"></canvas>
      </section>
    </div>
  </main>
  <script type="module" src="./generated/generatedParserC1.js"></script>
  <script type="module" src="./generated/generatedParserC2.js"></script>
</body>
</html>
