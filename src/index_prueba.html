const http=require("http");
const {WebSocketServer,WebSocket}=require("ws");
const {execFile}=require("child_process");
const fs=require("fs");
const path=require("path");

const CONTROL_PORT=8080, VIDEO_PORT=8084, WEB_PORT=3030, CDP_PORT=9222;
const APP_URL=`http://127.0.0.1:${WEB_PORT}/src/index.html`;
const CHROME_PROFILE=process.env.CHROME_REMOTE_PROFILE||"E:\\ChromeRemote";

function chromeArgs(){
  return [
    "--remote-debugging-address=127.0.0.1",
    `--remote-debugging-port=${CDP_PORT}`,
    `--user-data-dir=${CHROME_PROFILE}`,
    "--window-size=1280,720",
    "--force-device-scale-factor=1",
    "--no-first-run",
    "--no-default-browser-check",
    "--disable-background-networking",
    "--disable-component-update",
    "--disable-features=Translate",
    "--disable-sync",
    "--disable-default-apps",
    "--disable-background-timer-throttling",
    "--disable-backgrounding-occluded-windows",
    "--disable-renderer-backgrounding",
    `--app=${APP_URL}`
  ];
}

const MAX_INPUT_AGE=10000;
const MAX_PENDING_CDP_COMMANDS=8;
const CDP_COMMAND_TIMEOUT=5000, CDP_INPUT_TIMEOUT=1500;
const MAX_VIDEO_BUFFER=1024*1024, MAX_VIDEO_FRAME_AGE=1000;
const MOUSE_MOVE_INTERVAL=16, MAX_DISCRETE_INPUTS=4;
const RESTART_MIN=5000, RESTART_MAX=30000;

let shuttingDown=false,browser=null,chromeTimer=null,chromeBackoff=RESTART_MIN,chromeStarting=false;
let cdp=null,pageTarget=null,cdpTargetId=null,cdpId=0,cdpHandler=null,cdpConnectPromise=null;
const cdpCallbacks=new Map();
let cdpReconnectTimer=null,screencastActivo=false;

let laptopControlSocket=null,laptopVideoSocket=null;
const pendingHttpRequests=new Map();

let latestMouseMove=null,mouseMoveScheduled=false;
let latestWheel=null,wheelScheduled=false;
const discreteInputs=[]; let discreteWorker=false;
const mouseInputs=[]; let mouseWorker=false;
const stats={received:0,stale:0,queueDrop:0,executed:0,errors:0,cdpBusy:0,frames:0,frameDrop:0,mouseMovesSent:0,mouseMoveSendFail:0};

let latestFrame=null,frameSending=false,frameTimer=null,frameNo=0;

function open(ws){return !!ws&&ws.readyState===WebSocket.OPEN}
function sendJSON(ws,v){if(!open(ws))return false;try{ws.send(JSON.stringify(v));return true}catch{return false}}
function inputValid(m){const t=Number(m?.timestamp);return !Number.isFinite(t)||t<=0||Date.now()-t<=MAX_INPUT_AGE}

const controlWss=new WebSocketServer({port:CONTROL_PORT,perMessageDeflate:false,maxPayload:16*1024*1024});
controlWss.on("connection",ws=>{
  console.log("[Casa] CONTROL conectado");
  if(laptopControlSocket&&laptopControlSocket!==ws)try{laptopControlSocket.close()}catch{}
  laptopControlSocket=ws;
  ws.on("message",r=>handleTunnel(ws,r));
  ws.on("close",()=>{if(laptopControlSocket===ws)laptopControlSocket=null;
    for(const [id,res] of pendingHttpRequests){try{if(!res.headersSent)res.writeHead(503);res.end()}catch{}pendingHttpRequests.delete(id)}
  });
  ws.on("error",e=>console.error("[Casa] CONTROL:",e.message));
  startChrome("control");
});

const videoWss=new WebSocketServer({port:VIDEO_PORT,perMessageDeflate:false,maxPayload:20*1024*1024});
videoWss.on("connection",ws=>{
  console.log("[Casa] VIDEO conectado");
  if(laptopVideoSocket&&laptopVideoSocket!==ws)try{laptopVideoSocket.close()}catch{}
  laptopVideoSocket=ws; latestFrame=null; frameSending=false;
  ws.on("close",()=>{if(laptopVideoSocket===ws)laptopVideoSocket=null;latestFrame=null;frameSending=false});
  ws.on("error",e=>console.error("[Casa] VIDEO:",e.message));
});

const server=http.createServer((req,res)=>{
  res.setHeader("Access-Control-Allow-Origin","*");
  res.setHeader("Access-Control-Allow-Methods","GET,PUT,POST,DELETE,OPTIONS,PATCH");
  res.setHeader("Access-Control-Allow-Headers","*");
  if(req.method==="OPTIONS"){res.writeHead(204);res.end();return}
  if(!open(laptopControlSocket)){res.writeHead(503,{"Content-Type":"text/plain;charset=utf-8"});res.end("Tunel no activo");return}
  const id=Math.random().toString(36).slice(2)+Date.now().toString(36),chunks=[];
  req.on("data",c=>chunks.push(c));
  req.on("end",()=>{
    if(!open(laptopControlSocket)){if(!res.headersSent)res.writeHead(503);res.end();return}
    pendingHttpRequests.set(id,res);
    if(!sendJSON(laptopControlSocket,{type:"request",id,method:req.method,url:req.url||"/",headers:req.headers,body:Buffer.concat(chunks).toString("base64")})){
      pendingHttpRequests.delete(id);if(!res.headersSent)res.writeHead(502);res.end()
    }
  });
});
server.listen(WEB_PORT,"127.0.0.1",()=>console.log("[Casa] HTTP",APP_URL));

function handleTunnel(ws,raw){
  if(ws!==laptopControlSocket)return;
  let m;try{m=JSON.parse(raw.toString())}catch{return}
  if(m.type==="input"){handleInput(m);return}
  if(m.type==="refresh"){console.log("[Casa] REFRESH recibido desde viewer");refreshPage("viewer");return}
  if(m.type==="requestFrame"){sendLatestFrame("viewer-request");return}
  if(m.type==="response"){handleHTTPResponse(m);return}
  if(m.type==="ping"){sendJSON(ws,{type:"pong",timestamp:Date.now()})}
}
function handleHTTPResponse(m){
  const res=pendingHttpRequests.get(m.id);
  if(!res)return;
  if(!res.headersSent&&m.headers){
    const h={...m.headers};
    delete h["content-length"];delete h["transfer-encoding"];delete h.connection;
    try{res.writeHead(m.statusCode||200,h)}
    catch{pendingHttpRequests.delete(m.id);try{res.end()}catch{};return}
  }
  if(m.data)try{res.write(Buffer.from(m.data,"base64"))}catch{}
  if(m.end){try{res.end()}catch{}pendingHttpRequests.delete(m.id)}
}

function handleInput(m){
  stats.received++;if(!inputValid(m)){stats.stale++;return}
  if(m.event==="mouseMoved"||m.event==="mousePressed"||m.event==="mouseReleased"){
    // Todos los eventos de ratón pasan por UNA sola cola para preservar el orden:
    // move -> mousePressed -> moves -> mouseReleased. Esto es imprescindible para drag/select.
    if(m.event==="mouseMoved" && !(Number(m.buttons)||0) && mouseInputs.length && mouseInputs[mouseInputs.length-1].event==="mouseMoved" && !(Number(mouseInputs[mouseInputs.length-1].buttons)||0)) mouseInputs[mouseInputs.length-1]=m;
    else {
      if(mouseInputs.length>=64){
        // Nunca descartamos press/release. Si hay demasiados moves, quitamos uno de ellos.
        const i=mouseInputs.findIndex(x=>x.event==="mouseMoved");
        if(i>=0)mouseInputs.splice(i,1);else{stats.queueDrop++;return}
      }
      mouseInputs.push(m);
    }
    runMouse();return
  }
  if(m.event==="mouseWheel"){
    latestWheel=latestWheel?{...m,deltaX:(Number(latestWheel.deltaX)||0)+(Number(m.deltaX)||0),deltaY:(Number(latestWheel.deltaY)||0)+(Number(m.deltaY)||0)}:{...m};
    programWheel();return
  }
  if(discreteInputs.length>=MAX_DISCRETE_INPUTS){discreteInputs.shift();stats.queueDrop++}
  discreteInputs.push(m);runDiscrete()
}
async function runMouse(){
  if(mouseWorker)return;mouseWorker=true;
  try{
    while(mouseInputs.length){
      const m=mouseInputs.shift();
      if(!inputValid(m)){stats.stale++;continue}
      await safeInput(m);
    }
  }finally{mouseWorker=false}
}
function programWheel(){if(wheelScheduled)return;wheelScheduled=true;setTimeout(async()=>{wheelScheduled=false;const m=latestWheel;latestWheel=null;if(m)await safeInput(m);if(latestWheel)programWheel()},MOUSE_MOVE_INTERVAL)}
async function runDiscrete(){
  if(discreteWorker)return;discreteWorker=true;
  try{while(discreteInputs.length){const m=discreteInputs.shift();if(!inputValid(m)){stats.stale++;continue}await safeInput(m)}}finally{discreteWorker=false}
}
async function safeInput(m){if(!inputValid(m)||!open(cdp)){if(!inputValid(m))stats.stale++;return}try{await executeInput(m);stats.executed++}catch(e){stats.errors++;console.error("[Casa] input:",e.message)}}
async function executeInput(m){
  const x=Number(m.x)||0,y=Number(m.y)||0,modifiers=Number(m.modifiers)||0;
  if(m.event==="mouseMoved"){
    // CDP simula la posición del puntero dentro del target aunque no exista
    // un cursor físico en el PC remoto. El último mouseMoved determina la
    // posición que Chromium usará para clicks/context menus.
    const activeButtons=Number(m.buttons)||0;
    const activeButton=String(m.button||"none");
    const ok=cdpSendFireAndForget("Input.dispatchMouseEvent",{
      type:"mouseMoved",
      x,y,
      button:["none","left","middle","right","back","forward"].includes(activeButton)?activeButton:"none",
      buttons:activeButtons,
      modifiers
    });
    if(ok)stats.mouseMovesSent++;else stats.mouseMoveSendFail++;
    return ok;
  }
  if(m.event==="mousePressed"||m.event==="mouseReleased"){
    // Importante: esto NO es un click. CDP recibe literalmente mousePressed
    // o mouseReleased y el botón que llegó del viewer (left/right/middle/back/forward).
    // El arrastre se construye con pressed + mouseMoved(buttons!=0) + released.
    const button=["left","right","middle","back","forward"].includes(String(m.button))?String(m.button):"left";
    const buttons=Number.isFinite(Number(m.buttons))?Number(m.buttons):0;
    const ok=cdpSendFireAndForget("Input.dispatchMouseEvent",{
      type:m.event,
      x,y,
      button,
      buttons,
      clickCount:Number(m.clickCount)||1,
      modifiers
    });
    if(ok)stats.inputSent++;else stats.inputSendFail++;
    return ok;
  }
  if(m.event==="mouseWheel"){
    const ok=cdpSendFireAndForget("Input.dispatchMouseEvent",{type:"mouseWheel",x,y,deltaX:Number(m.deltaX)||0,deltaY:Number(m.deltaY)||0,modifiers,buttons:Number(m.buttons)||0});
    if(ok)stats.inputSent++;else stats.inputSendFail++;
    return ok;
  }
  if(m.event==="keyDown"||m.event==="keyUp"){
    const key=String(m.key||"");
    const code=String(m.code||"");
    const keyCodes={Shift:16,Control:17,Alt:18,Meta:91,Enter:13,Escape:27,Delete:46,Tab:9,Backspace:8,Space:32};
    const vk=Number(m.keyCode)||keyCodes[key]||0;
    const p={
      type:m.event,
      key,
      code,
      modifiers,
      windowsVirtualKeyCode:vk,
      nativeVirtualKeyCode:vk,
      autoRepeat:!!m.autoRepeat
    };
    if(m.event==="keyDown"&&m.text&&!["Shift","Control","Alt","Meta","Escape","Tab","Enter","Backspace"].includes(key)){
      p.text=String(m.text);
      p.unmodifiedText=String(m.text);
    }
    const ok=cdpSendFireAndForget("Input.dispatchKeyEvent",p);
    if(ok)stats.inputSent++;else stats.inputSendFail++;
    return ok;
  }
}

function limpiarCDP(reason="cleanup"){
  screencastActivo=false;
  if(cdp&&cdpHandler)try{cdp.off("message",cdpHandler)}catch{}
  if(cdp)try{if(cdp.readyState===WebSocket.OPEN||cdp.readyState===WebSocket.CONNECTING)cdp.close()}catch{}
  for(const [id,cb] of cdpCallbacks)try{cb({id,error:{message:"CDP cerrado: "+reason}})}catch{}
  cdpCallbacks.clear();cdp=null;cdpHandler=null;pageTarget=null;cdpTargetId=null;
}
function cdpSendFireAndForget(method,params={}){
  if(!open(cdp))return false;
  try{
    const id=++cdpId;
    cdp.send(JSON.stringify({id,method,params}),err=>{
      if(err && method==="Input.dispatchMouseEvent" && params?.type==="mouseMoved")stats.mouseMoveSendFail++;
    });
    if(method==="Input.dispatchMouseEvent" && params?.type==="mouseMoved")stats.mouseMovesSent++;
    return true;
  }catch{
    if(method==="Input.dispatchMouseEvent" && params?.type==="mouseMoved")stats.mouseMoveSendFail++;
    return false;
  }
}

function cdpSend(method,params={},timeout=CDP_COMMAND_TIMEOUT){
  if(!open(cdp))return Promise.reject(new Error("CDP no conectado"));
  if(cdpCallbacks.size>=MAX_PENDING_CDP_COMMANDS){stats.cdpBusy++;return Promise.reject(new Error(`CDP ocupado; comando descartado: ${method}`))}
  const id=++cdpId;
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{if(!cdpCallbacks.has(id))return;cdpCallbacks.delete(id);reject(new Error("Timeout CDP: "+method))},timeout);
    cdpCallbacks.set(id,msg=>{clearTimeout(timer);if(msg.error)reject(new Error(msg.error.message||"CDP error"));else resolve(msg)});
    try{cdp.send(JSON.stringify({id,method,params}),err=>{if(err&&cdpCallbacks.has(id)){cdpCallbacks.delete(id);clearTimeout(timer);reject(err)}})}
    catch(e){cdpCallbacks.delete(id);clearTimeout(timer);reject(e)}
  })
}
async function targets(){
  return new Promise((resolve,reject)=>{const r=http.get({hostname:"127.0.0.1",port:CDP_PORT,path:"/json",timeout:2000},res=>{const a=[];res.on("data",c=>a.push(c));res.on("end",()=>{try{resolve(JSON.parse(Buffer.concat(a)))}catch(e){reject(e)}})});r.on("timeout",()=>r.destroy());r.on("error",reject)})
}
function waitCDP(ms=20000){
  return new Promise((resolve,reject)=>{const start=Date.now();function test(){const r=http.get({hostname:"127.0.0.1",port:CDP_PORT,path:"/json/version",timeout:1500},res=>{if(res.statusCode===200){resolve();return}retry()});r.on("timeout",()=>r.destroy());r.on("error",retry);function retry(){if(Date.now()-start>=ms){reject(new Error("Timeout esperando CDP"));return}setTimeout(test,250)}}test()})
}
async function connectCDP(){
  if(cdpConnectPromise)return cdpConnectPromise;
  cdpConnectPromise=connectCDPInternal().finally(()=>cdpConnectPromise=null);return cdpConnectPromise
}

let refreshSeq=0;
async function refreshPage(reason="manual"){
  if(!open(cdp)){
    console.warn(`[Casa] Refresh solicitado pero CDP no está conectado (${reason})`);
    return false;
  }
  try{
    // Poner el target en primer plano evita que el target CDP quede activo
    // en segundo plano cuando Chrome ha reutilizado una instancia existente.
    try{await cdpSend("Page.bringToFront",{},3000)}catch{}
    const ts=await targets();
    const pages=ts.filter(t=>t.type==="page");
    const target=pages.find(t=>t.id===cdpTargetId)||pageTarget;
    const url=String(target?.url||"");
    const seq=++refreshSeq;
    console.log(`[Casa] Refresh #${seq} (${reason}) target=${cdpTargetId||"?"}`);
    if(open(laptopControlSocket))sendJSON(laptopControlSocket,{type:"consoleClear"});
    try{await cdpSend("Page.stopLoading",{},1500)}catch{}
    // Page.reload fuerza una navegación nueva incluso si la URL no ha cambiado.
    // ignoreCache=true evita reutilizar el documento/recursos del refresco anterior.
    if(!url.startsWith(APP_URL)){
      await cdpSend("Page.navigate",{url:APP_URL},CDP_COMMAND_TIMEOUT);
    }else{
      await cdpSend("Page.reload",{ignoreCache:true},CDP_COMMAND_TIMEOUT);
    }
    return true;
  }catch(e){
    console.error(`[Casa] Refresh falló (${reason}):`,e.message);
    return false;
  }
}

function serializarConsoleArg(arg){
  if(!arg)return null;
  const out={type:arg.type||"object",description:arg.description||null};
  if(Object.prototype.hasOwnProperty.call(arg,"value")){
    try{out.value=arg.value}catch{}
  }else if(arg.unserializableValue!==undefined)out.unserializableValue=arg.unserializableValue;
  return out;
}
function enviarConsoleAlPortatil(payload){
  if(open(laptopControlSocket))sendJSON(laptopControlSocket,{type:"console",...payload});
}
function manejarEventoCDP(m){
  if(m.method==="Runtime.consoleAPICalled"){
    const p=m.params||{};
    const text=(p.args||[]).map(serializarConsoleArg).map(a=>{
      if(!a)return "";
      if(a.value!==undefined){try{return typeof a.value==="string"?a.value:JSON.stringify(a.value)}catch{return String(a.value)}}
      return a.description||a.unserializableValue||`[${a.type||"object"}]`;
    }).join(" ");
    const f=p.stackTrace?.callFrames?.[0];
    enviarConsoleAlPortatil({kind:"console",level:p.type||"log",text,timestamp:p.timestamp||Date.now(),
      stack:f?{url:f.url||"",lineNumber:(f.lineNumber??0)+1}:null});
  }else if(m.method==="Runtime.exceptionThrown"){
    const p=m.params||{},d=p.exceptionDetails||{},f=d.stackTrace?.callFrames?.[0];
    enviarConsoleAlPortatil({kind:"exception",level:"error",text:d.text||d.exception?.description||"Uncaught exception",
      timestamp:p.timestamp||Date.now(),stack:f?{url:f.url||"",lineNumber:(f.lineNumber??0)+1}:null});
  }
}
async function connectCDPInternal(){
  if(open(cdp))return;
  limpiarCDP("reconnect");
  const ts=await targets();
  const pages=ts.filter(t=>t.type==="page");
  pageTarget=pages.find(t=>String(t.url||"").includes(`127.0.0.1:${WEB_PORT}/src/index.html`))
    ||pages.find(t=>String(t.url||"").includes(`127.0.0.1:${WEB_PORT}`))
    ||pages[0];
  if(!pageTarget?.webSocketDebuggerUrl)throw new Error("No hay página CDP");
  cdpTargetId=pageTarget.id||null;
  console.log(`[Casa] CDP target=${cdpTargetId||"?"} url=${pageTarget.url||""} pages=${pages.length}`);
  const s=new WebSocket(pageTarget.webSocketDebuggerUrl);cdp=s;
  await new Promise((resolve,reject)=>{const t=setTimeout(()=>{try{s.close()}catch{}reject(new Error("Timeout socket CDP"))},10000);s.once("open",()=>{clearTimeout(t);resolve()});s.once("error",e=>{clearTimeout(t);reject(e)})});
  cdpHandler=raw=>{let m;try{m=JSON.parse(raw.toString())}catch{return}if(m.id!==undefined){const cb=cdpCallbacks.get(m.id);if(cb){cdpCallbacks.delete(m.id);cb(m)}}manejarEventoCDP(m);if(m.method==="Page.screencastFrame")handleFrame(m)};
  s.on("message",cdpHandler);
  s.on("close",()=>{
    const wasCurrent=cdp===s;
    if(wasCurrent){cdp=null;screencastActivo=false;cdpTargetId=null}
    for(const [id,cb] of cdpCallbacks)try{cb({id,error:{message:"socket CDP cerrado"}})}catch{}
    cdpCallbacks.clear();
    if(wasCurrent&&!shuttingDown)scheduleCDP();
  });
  s.on("error",e=>console.error("[Casa] CDP:",e.message));

  await cdpSend("Page.enable");
  try{await cdpSend("Page.bringToFront",{},3000)}catch{}

  // El proceso launcher de Chrome puede terminar aunque la instancia real
  // siga viva. En ese caso el perfil puede conservar una pestaña que no sea
  // nuestra APP_URL. No confiamos en --app= para corregirlo: navegamos por
  // CDP a la página de la aplicación cuando el target seleccionado apunta a
  // otra URL.
  const currentUrl=String(pageTarget.url||"");
  if(!currentUrl.startsWith(APP_URL)){
    console.log(`[Casa] Target no es APP_URL (${currentUrl||"sin URL"}); navegando a ${APP_URL}`);
    try{
      const nav=await cdpSend("Page.navigate",{url:APP_URL},CDP_COMMAND_TIMEOUT);
      if(nav?.error)throw new Error(nav.error.message||"Page.navigate falló");
    }catch(e){
      console.error("[Casa] No se pudo navegar a APP_URL:",e.message);
      throw e;
    }
  }

  try{await cdpSend("Runtime.enable")}catch(e){console.error("[Casa] Runtime.enable:",e.message)}
  try{await cdpSend("Input.setIgnoreInputEvents",{ignore:false})}catch{}
  await cdpSend("Page.startScreencast",{format:"jpeg",quality:40,maxWidth:1280,maxHeight:720,everyNthFrame:2,captureBeyondViewport:false});
  screencastActivo=true;
  console.log(`[Casa] CDP preparado target=${cdpTargetId||"?"} url=${APP_URL}`);
}

function handleFrame(m){
  const p=m?.params;
  if(!p?.sessionId)return;

  // ACK inmediatamente. Nunca esperamos a que se envíe el JPEG para
  // confirmar el frame a Chromium.
  cdpSendFireAndForget("Page.screencastFrameAck",{sessionId:p.sessionId});

  if(!p.data||!open(laptopVideoSocket))return;

  stats.frames++;
  latestFrame={data:String(p.data),timestamp:Date.now(),frame:++frameNo};
  programFrameSend();
}

function sendLatestFrame(reason="stream"){
  if(latestFrame){
    programFrameSend(true);
    return;
  }
  if(!open(cdp)){
    console.warn(`[Casa] No hay frame ni CDP para atender requestFrame (${reason})`);
    return;
  }
  cdpSend("Page.captureScreenshot",{format:"jpeg",quality:40,fromSurface:true},3000).then(r=>{
    if(!r?.data)return;
    latestFrame={data:String(r.data),timestamp:Date.now(),frame:++frameNo};
    stats.frames++;
    programFrameSend(true);
  }).catch(e=>console.warn(`[Casa] Captura puntual falló (${reason}):`,e.message));
}

function programFrameSend(force=false){
  if(frameSending||frameTimer)return;
  frameTimer=setImmediate(()=>{
    frameTimer=null;
    flushFrame(force);
  });
}

function flushFrame(force=false){
  if(frameSending)return;
  const ws=laptopVideoSocket;
  if(!open(ws))return;
  const f=latestFrame;
  if(!f)return;
  if(!force && Date.now()-f.timestamp>MAX_VIDEO_FRAME_AGE){stats.frameDrop++;return;}

  if(Number(ws.bufferedAmount||0)>MAX_VIDEO_BUFFER){
    stats.frameDrop++;
    try{ws.close()}catch{}
    return;
  }

  const msg=JSON.stringify({type:"frame",data:f.data,frame:f.frame,timestamp:Date.now()});
  if(Buffer.byteLength(msg)>MAX_VIDEO_BUFFER){stats.frameDrop++;return;}

  frameSending=true;
  const sentFrame=f.frame;
  try{
    ws.send(msg,err=>{
      frameSending=false;
      if(err){stats.frameDrop++;return;}
      if(latestFrame && latestFrame.frame!==sentFrame)programFrameSend(false);
    });
  }catch{
    frameSending=false;
    stats.frameDrop++;
  }
}
function scheduleCDP(){
  if(cdpReconnectTimer||shuttingDown)return;
  cdpReconnectTimer=setTimeout(()=>{
    cdpReconnectTimer=null;
    connectCDP().catch(()=>{
      if(!shuttingDown)scheduleCDP();
    });
  },1000)
}

function scheduleChromeRestart(reason="supervisor"){
  if(chromeTimer||shuttingDown||chromeStarting)return;
  const d=chromeBackoff;
  console.log(`[Casa] Reinicio Chromium en ${d} ms (${reason})`);
  chromeTimer=setTimeout(()=>{
    chromeTimer=null;
    startChrome(reason).catch(()=>{});
  },d);
  chromeBackoff=Math.min(chromeBackoff*2,RESTART_MAX);
}

async function cdpAlive(){
  try{
    await waitCDP(800);
    return true;
  }catch{return false}
}

function findChrome(){
  const candidates=[
    process.env.CHROME_PATH,
    "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe",
    "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe",
    path.join(process.env.LOCALAPPDATA||"", "Google\\Chrome\\Application\\chrome.exe"),
    path.join(process.env.PROGRAMFILES||"", "Google\\Chrome\\Application\\chrome.exe"),
    path.join(process.env["PROGRAMFILES(X86)"]||"", "Google\\Chrome\\Application\\chrome.exe")
  ].filter(Boolean);
  for(const p of candidates){try{if(fs.existsSync(p))return p}catch{}}
  throw new Error("No se encontró chrome.exe. Define CHROME_PATH.");
}

async function startChrome(reason="supervisor"){
  if(shuttingDown||chromeStarting)return;
  chromeStarting=true;
  let child=null;
  try{
    // Regla fundamental: si 9222 está vivo, Chromium ya existe.
    // No lanzar jamás otro chrome.exe aunque el proceso launcher anterior
    // haya emitido exit=0.
    if(await cdpAlive()){
      try{
        if(!open(cdp))await connectCDP();
        await refreshPage(`server-start:${reason}`);
        chromeBackoff=RESTART_MIN;
        console.log(`[Casa] CDP existente reutilizado (${reason}); página refrescada`);
        return;
      }catch(e){
        console.warn("[Casa] CDP existe pero no se pudo conectar:",e.message);
        // Solo continuamos al lanzamiento si el endpoint dejó de existir.
        if(await cdpAlive())throw e;
      }
    }

    if(open(cdp)){
      chromeBackoff=RESTART_MIN;
      return;
    }

    const chromePath=findChrome();
    console.log("[Casa] Lanzando Chromium:",chromePath);
    child=execFile(chromePath,chromeArgs(),{windowsHide:false});
    browser=child;

    child.stderr?.on("data",d=>{
      const s=String(d).trim();
      if(s)console.error("[Chrome]",s);
    });
    child.on("error",e=>console.error("[Casa] Chrome:",e.message));

    child.on("exit",async(code,signal)=>{
      const wasCurrent=browser===child;
      if(wasCurrent)browser=null;
      console.log(`[Casa] Proceso launcher Chrome terminó code=${code} signal=${signal}`);

      // MUY IMPORTANTE en Windows: el chrome.exe que devuelve execFile
      // puede ser solo el launcher. Si CDP sigue vivo, el navegador real
      // sigue funcionando y NO se debe reiniciar.
      if(!shuttingDown && await cdpAlive()){
        chromeBackoff=RESTART_MIN;
        console.log("[Casa] CDP sigue vivo tras exit de Chrome; se conserva la sesión");
        if(!open(cdp))connectCDP().catch(()=>scheduleCDP());
        return;
      }

      // Aquí sí desapareció Chromium de verdad.
      if(!shuttingDown){
        if(open(cdp))limpiarCDP("CDP perdido junto con Chromium");
        scheduleChromeRestart("Chromium perdido");
      }
    });

    // Esperar CDP, pero no confundir la publicación de CDP con la vida
    // del proceso launcher.
    await waitCDP(30000);
    if(!open(cdp))await connectCDP();
    chromeBackoff=RESTART_MIN;
    console.log(`[Casa] Chromium/CDP operativo (${reason})`);
  }catch(e){
    console.error("[Casa] inicio Chrome:",e.message);
    if(child && browser===child){
      try{child.kill()}catch{}
      browser=null;
    }
    // Antes de programar otro Chrome comprobamos otra vez CDP. Si está vivo,
    // no hay nada que reiniciar.
    if(!shuttingDown){
      if(await cdpAlive()){
        chromeBackoff=RESTART_MIN;
        try{if(!open(cdp))await connectCDP()}catch{}
      }else{
        scheduleChromeRestart("fallo de arranque");
      }
    }
  }finally{
    chromeStarting=false;
  }
}

setInterval(()=>{
  if(shuttingDown||chromeStarting)return;
  if(open(cdp))return;
  if(!browser)startChrome("supervisor").catch(()=>{});
  else scheduleCDP();
},2000).unref();

function shutdown(sig){
  if(shuttingDown)return;shuttingDown=true;
  if(chromeTimer)clearTimeout(chromeTimer);if(cdpReconnectTimer)clearTimeout(cdpReconnectTimer);if(frameTimer)clearTimeout(frameTimer);
  limpiarCDP("shutdown");if(browser)try{browser.kill()}catch{}
  for(const [,r] of pendingHttpRequests)try{r.end()}catch{}
  try{controlWss.close()}catch{}try{videoWss.close()}catch{}try{server.close()}catch{}
  setTimeout(()=>process.exit(0),500)
}
